<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Resource Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f9;--sf:#fff;--tx:#1b2430;--mu:#667085;--bd:#e0e4ea;--ac:#2563eb;--rd:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--sf:#1b212a;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2d3643;--ac:#5b8def;--rd:#f26b6b}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
nav{width:210px;background:var(--sf);border-right:1px solid var(--bd);padding:14px 8px;flex-shrink:0}
nav h1{font-size:15px;margin:0 8px 12px}nav a{display:block;padding:9px 10px;border-radius:6px;color:var(--tx);cursor:pointer;margin-bottom:2px}
nav a.on{background:var(--ac);color:#fff}nav a:hover:not(.on){background:var(--bg)}
main{flex:1;padding:20px;min-width:0}h2{margin:0 0 14px;font-size:19px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto;margin-right:6px}.ck{display:flex;align-items:center;margin:8px 0;color:var(--tx);font-size:14px}
button{padding:7px 13px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--tx);cursor:pointer;font:inherit}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.d{color:var(--rd)}
.plus{width:30px;height:30px;padding:0;border-radius:50%;background:var(--ac);color:#fff;font-size:18px;line-height:1}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--mu)}
.tag{font-size:11px;padding:2px 7px;border-radius:9px;background:var(--bg);border:1px solid var(--bd)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
#modal>div{background:var(--sf);border-radius:10px;padding:18px;width:420px;max-width:100%;max-height:90vh;overflow:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.tree ul{list-style:none;padding-left:18px;border-left:1px dashed var(--bd);margin:4px 0}.tree{padding-left:0}
.cell{text-align:center;min-width:64px;border-radius:4px}.mu{color:var(--mu);font-size:12px}
@media(max-width:700px){body{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;padding:6px}nav h1{display:none}nav a{white-space:nowrap}}
</style></head><body>
<nav id="nav"></nav><main id="main"></main><div id="modal"><div id="mb"></div></div>
<script>
const K='rm_tool_v1';let S,me,page='profile',wk=0;
const def=()=>({users:[
{id:'E001',name:'Ravi Shastri',doj:'2012-04-02',role:'Admin',mgr:'',acc:'team',active:1,notif:1},
{id:'E002',name:'Anita Rao',doj:'2016-07-11',role:'Manager',mgr:'E001',acc:'team',active:1,notif:1},
{id:'E003',name:'Karan Mehta',doj:'2021-01-18',role:'User',mgr:'E002',acc:'self',active:1,notif:1},
{id:'E004',name:'Meera Iyer',doj:'2022-09-05',role:'User',mgr:'E002',acc:'self',active:1,notif:1}],
projects:[{code:'PRJ-0001',name:'Atlas Migration',client:'Acme',start:'2026-10-01',end:'2027-03-31',status:'Active',bill:'Billable',pm:'E002',hrs:800,notes:''},
{code:'PRJ-0002',name:'Kantata Rollout',client:'Internal',start:'2026-11-01',end:'2027-01-31',status:'Planned',bill:'Non-billable',pm:'E001',hrs:300,notes:''}],
bookings:[{id:1,uid:'E003',code:'PRJ-0001',from:'2026-11-02',to:'2026-11-27',hph:6}],seq:2});
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=def();me=S.users[0].id;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const U=id=>S.users.find(u=>u.id==id),P=c=>S.projects.find(p=>p.code==c),M=()=>U(me),isA=()=>M().role=='Admin';
const team=u=>S.users.filter(x=>x.mgr==u.id);
const canEdit=t=>isA()||t==me||(M().acc=='team'&&U(t).mgr==me);
const visible=()=>S.users.filter(u=>u.active&&(isA()||u.id==me||(M().role=='Manager'&&u.mgr==me)));
const iso=d=>d.toISOString().slice(0,10),D=s=>new Date(s+'T00:00:00Z');
function wdays(a,b){let n=0;for(let d=D(a);d<=D(b);d.setUTCDate(d.getUTCDate()+1)){const w=d.getUTCDay();if(w&&w<6)n++}return n}
const pages=[['profile','Create my user profile'],['admin','Admin'],['proj','Project configuration'],['sched','Schedules'],['rep','Reports']];
function nav(){const ok=p=>!['admin','proj','rep'].includes(p)||isA();
$('nav').innerHTML='<h1>Resource Planner</h1><label style="margin:0 8px 4px">Signed in as (demo)</label><select style="margin:0 0 12px;width:calc(100% - 4px)" onchange="me=this.value;page=\'profile\';go()">'+S.users.filter(u=>u.active).map(u=>`<option value="${u.id}" ${u.id==me?'selected':''}>${esc(u.name)} (${u.role})</option>`).join('')+'</select>'+pages.filter(p=>ok(p[0])).map(p=>`<a class="${page==p[0]?'on':''}" onclick="page='${p[0]}';go()">${p[1]}</a>`).join('')}
function go(){if(['admin','proj','rep'].includes(page)&&!isA())page='profile';nav();({profile,admin,proj,sched,rep})[page]()}
function open_(h){$('mb').innerHTML=h;$('modal').style.display='flex'}function close_(){$('modal').style.display='none'}
const fld=(l,id,v='',t='text',x='')=>`<label>${l}</label><input id="${id}" type="${t}" value="${esc(v)}" ${x}>`;
const val=i=>$(i).value.trim();
function profile(){const u=M();$('main').innerHTML=`<h2>My user profile</h2><div class="card" style="max-width:520px">
${fld('Name','pn',u.name)}${fld('EMP ID','pi',u.id,'text','disabled')}${fld('Date of joining','pd',u.doj,'date')}
<label>Access persona</label><input value="${u.role}${u.acc=='team'&&u.role=='User'?' (self + direct reports)':''}" disabled>
<label style="margin-top:14px">Password reset</label><div class="ck"><input type="checkbox" id="pr"> Send me a password reset on next sign-in</div>
<label>Notification control</label><div class="ck"><input type="checkbox" id="n1" ${u.notif?'checked':''}> Email me when my schedule changes</div>
<div class="ck"><input type="checkbox" id="n2" checked> Weekly under/over-booking reminder</div>
<button class="p" onclick="saveProf()" style="margin-top:10px">Save</button> <span id="ok" class="mu"></span></div>`}
function saveProf(){const u=M();u.name=val('pn')||u.name;u.doj=val('pd');u.notif=$('n1').checked?1:0;save();nav();$('ok').textContent='Saved'}
function admin(){const mg=u=>u.mgr?esc(U(u.mgr)?.name):'-';
const tree=(id)=>{const k=S.users.filter(u=>u.mgr==id);return k.length?'<ul>'+k.map(u=>`<li>${esc(u.name)} <span class="mu">${u.role}${u.active?'':' · inactive'}</span>${tree(u.id)}</li>`).join('')+'</ul>':''};
const roots=S.users.filter(u=>!u.mgr||!U(u.mgr));
$('main').innerHTML=`<div class="bar"><h2 style="margin:0">Admin: users</h2><button class="plus" title="Create user" onclick="userForm()">+</button></div>
<div class="card tw"><table><tr><th>EMP ID</th><th>Name</th><th>Joined</th><th>Persona</th><th>Manager</th><th>Can update</th><th>Status</th><th></th></tr>
${S.users.map(u=>`<tr><td>${u.id}</td><td>${esc(u.name)}</td><td>${u.doj}</td><td><span class="tag">${u.role}</span></td><td>${mg(u)}</td><td>${u.role=='User'?(u.acc=='team'?'Self + reports':'Self'):'Self + reports'}</td><td>${u.active?'Active':'Inactive'}</td>
<td><button onclick="userForm('${u.id}')">Edit</button> ${u.id==me?'':`<button class="d" onclick="toggleU('${u.id}')">${u.active?'Deactivate':'Activate'}</button>`}</td></tr>`).join('')}</table></div>
<div class="card"><b>Reporting hierarchy</b><div class="tree">${roots.map(r=>`<ul><li>${esc(r.name)} <span class="mu">${r.role}</span>${tree(r.id)}</li></ul>`).join('')}</div></div>`}
function toggleU(id){const u=U(id);u.active=u.active?0:1;save();go()}
function userForm(id){const u=id?U(id):{id:'',name:'',doj:'',role:'User',mgr:'',acc:'self'};
open_(`<h3 style="margin-top:0">${id?'Edit':'Create'} user</h3>${fld('Name','un',u.name)}<div class="g2"><div>${fld('EMP ID','ui',u.id,'text',id?'disabled':'')}</div><div>${fld('Date of joining','ud',u.doj,'date')}</div></div>
<label>Access persona</label><select id="ur"><option>Admin</option><option>Manager</option><option>User</option></select>
<label>Reporting manager</label><select id="um"><option value="">None</option>${S.users.filter(x=>x.id!=id&&x.active).map(x=>`<option value="${x.id}" ${x.id==u.mgr?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
<label>Schedule access (for User persona)</label><select id="ua"><option value="self">Update self only</option><option value="team">Update self + direct reports</option></select>
<p id="ue" style="color:var(--rd);margin:8px 0"></p><button class="p" onclick="saveU('${id||''}')">Save</button> <button onclick="close_()">Cancel</button>`);$('ur').value=u.role;$('ua').value=u.acc}
function saveU(id){const n=val('un'),i=id||val('ui');if(!n||!i)return $('ue').textContent='Name and EMP ID are required.';
if(!id&&U(i))return $('ue').textContent='That EMP ID already exists.';
const o={id:i,name:n,doj:val('ud'),role:$('ur').value,mgr:$('um').value,acc:$('ua').value,active:1,notif:1};
if(id)Object.assign(U(id),o,{active:U(id).active,notif:U(id).notif});else S.users.push(o);save();close_();go()}
function proj(){$('main').innerHTML=`<div class="bar"><h2 style="margin:0">Project configuration</h2><button class="plus" title="Add project" onclick="projForm()">+</button></div>
<div class="card tw"><table><tr><th>Code</th><th>Project</th><th>Client</th><th>Start</th><th>End</th><th>Status</th><th>Type</th><th>PM</th><th>Budget hrs</th></tr>
${S.projects.map(p=>`<tr><td><b>${p.code}</b></td><td>${esc(p.name)}</td><td>${esc(p.client)}</td><td>${p.start}</td><td>${p.end}</td><td><span class="tag">${p.status}</span></td><td>${p.bill}</td><td>${esc(U(p.pm)?.name||'-')}</td><td>${p.hrs}</td></tr>`).join('')}</table></div>`}
function projForm(){const code='PRJ-'+String(S.seq+1).padStart(4,'0');
open_(`<h3 style="margin-top:0">Add project</h3>${fld('Project name','pjn')}${fld('Project code (auto)','pjc',code,'text','disabled')}${fld('Client','pjcl')}
<div class="g2"><div>${fld('Start date','pjs','','date')}</div><div>${fld('End date','pje','','date')}</div></div>
<div class="g2"><div><label>Status</label><select id="pjt"><option>Planned</option><option>Active</option><option>On hold</option><option>Closed</option></select></div><div><label>Type</label><select id="pjb"><option>Billable</option><option>Non-billable</option></select></div></div>
<div class="g2"><div><label>Project manager</label><select id="pjm">${S.users.filter(u=>u.active).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div><div>${fld('Budget hours','pjh','','number')}</div></div>
<label>Notes</label><textarea id="pjo" rows="2"></textarea><p id="pe" style="color:var(--rd);margin:8px 0"></p><button class="p" onclick="saveP()">Save</button> <button onclick="close_()">Cancel</button>`)}
function saveP(){const n=val('pjn'),s=val('pjs'),e=val('pje');if(!n)return $('pe').textContent='Project name is required.';
if(S.projects.some(p=>p.name.toLowerCase()==n.toLowerCase()))return $('pe').textContent='A project with this name exists.';
if(s&&e&&e<s)return $('pe').textContent='End date is before start date.';
S.seq++;S.projects.push({code:'PRJ-'+String(S.seq).padStart(4,'0'),name:n,client:val('pjcl'),start:s,end:e,status:$('pjt').value,bill:$('pjb').value,pm:$('pjm').value,hrs:+val('pjh')||0,notes:val('pjo')});save();close_();go()}
function mon(o){const d=new Date();d.setUTCHours(0,0,0,0);d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)+o*7);return d}
function sched(){const W=[...Array(6)].map((_,i)=>mon(wk+i));
const hrs=(u,w)=>{const a=iso(w),e=new Date(w);e.setUTCDate(e.getUTCDate()+4);const b=iso(e);let h=0;S.bookings.filter(x=>x.uid==u.id).forEach(x=>{const f=x.from>a?x.from:a,t=x.to<b?x.to:b;if(f<=t)h+=wdays(f,t)*x.hph});return h};
const lbl=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',timeZone:'UTC'});
$('main').innerHTML=`<div class="bar"><h2 style="margin:0">Schedules</h2><div><button onclick="wk-=4;sched()">&laquo; Prev</button> <button onclick="wk=0;sched()">Today</button> <button onclick="wk+=4;sched()">Next &raquo;</button></div></div>
<p class="mu">Hours per week (Mon–Fri). Shading shows load against a 40h week; red means over-booked.</p>
<div class="card tw"><table><tr><th>Resource</th>${W.map(w=>`<th style="text-align:center">${lbl(w)}</th>`).join('')}</tr>
${visible().map(u=>`<tr><td><b>${esc(u.name)}</b> <span class="mu">${u.id}</span> ${canEdit(u.id)?`<button class="plus" style="width:24px;height:24px;font-size:15px" title="Add booking" onclick="bkForm('${u.id}')">+</button>`:''}</td>
${W.map(w=>{const h=hrs(u,w),p=h/40;return `<td><div class="cell" style="padding:7px;background:${p>1?`rgba(220,38,38,${Math.min(.25+(p-1),.7)})`:`rgba(37,99,235,${h?.1+p*.5:0})`}">${h||'·'}</div></td>`}).join('')}</tr>
${S.bookings.filter(b=>b.uid==u.id).map(b=>`<tr><td colspan="7" class="mu" style="padding-left:24px">${esc(P(b.code)?.name||b.code)} · ${b.from} to ${b.to} · ${b.hph}h/day ${canEdit(u.id)?`<button class="d" style="padding:2px 8px;margin-left:8px" onclick="delB(${b.id})">Delete</button>`:''}</td></tr>`).join('')}`).join('')}</table></div>`}
function bkForm(uid){open_(`<h3 style="margin-top:0">Add booking for ${esc(U(uid).name)}</h3><label>Search project</label><input id="bp" list="pl" placeholder="Type a project name or code"><datalist id="pl">${S.projects.map(p=>`<option value="${esc(p.name)}">${p.code}</option>`).join('')}</datalist>
<div class="g2"><div>${fld('From','bf','','date')}</div><div>${fld('To','bt','','date')}</div></div>${fld('Hours per day','bh','8','number','min="0.5" max="24" step="0.5"')}
<p id="be" style="color:var(--rd);margin:8px 0"></p><button class="p" onclick="saveB('${uid}')">Save</button> <button onclick="close_()">Cancel</button>`)}
function saveB(uid){const q=val('bp').toLowerCase(),p=S.projects.find(x=>x.name.toLowerCase()==q||x.code.toLowerCase()==q),f=val('bf'),t=val('bt'),h=+val('bh');
const er=!p?'Pick a project from the list.':!f||!t?'Choose a date range.':t<f?'End date is before start date.':!(h>0&&h<=24)?'Enter hours between 0.5 and 24.':'';
if(er)return $('be').textContent=er;S.seq++;S.bookings.push({id:Date.now(),uid,code:p.code,from:f,to:t,hph:h});save();close_();sched()}
function delB(id){const b=S.bookings.find(x=>x.id==id),n=P(b.code)?.name||b.code;
open_(`<h3 style="margin-top:0">Delete booking</h3><p>Are you sure you want to delete the booking for "${esc(n)}"?</p><button class="d" onclick="S.bookings=S.bookings.filter(x=>x.id!=${id});save();close_();sched()">Yes, delete</button> <button onclick="close_()">Cancel</button>`)}
function rows(){return[['EMP ID','Name','Manager','Project code','Project','From','To','Hours/day','Working days','Total hours']].concat(S.bookings.filter(b=>U(b.uid)).map(b=>{const u=U(b.uid),d=wdays(b.from,b.to);return[u.id,u.name,U(u.mgr)?.name||'',b.code,P(b.code)?.name||'',b.from,b.to,b.hph,d,d*b.hph]}))}
const csv=()=>rows().map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
function rep(){const r=rows();$('main').innerHTML=`<h2>Reports</h2><div class="card"><button class="p" onclick="dl('csv')">Download CSV</button> <button onclick="dl('xls')">Download Excel</button> <button onclick="navigator.clipboard.writeText(csv()).then(()=>this.textContent='Copied')">Copy CSV</button>
<p class="mu">If your browser blocks the download, use Copy CSV and paste into Excel.</p></div><div class="card tw"><table><tr>${r[0].map(h=>`<th>${h}</th>`).join('')}</tr>${r.slice(1).map(x=>`<tr>${x.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`}
function dl(t){const r=rows(),x=t=='csv'?csv():'<table>'+r.map(a=>'<tr>'+a.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('')+'</table>';
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:t=='csv'?'text/csv':'application/vnd.ms-excel'}));a.download='schedule-report.'+t;document.body.appendChild(a);a.click();a.remove()}
go();
</script></body></html>
